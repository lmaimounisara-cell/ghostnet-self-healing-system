services:
  coordinator:
    build: ./services/coordinator
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://ghostnet:ghostnet_dev@db-coordinator:5432/ghostnet




  db-coordinator:
    image: postgres:16
    environment:
      POSTGRES_USER: ghostnet
      POSTGRES_PASSWORD: ghostnet_dev
      POSTGRES_DB: ghostnet
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

